name: CI-CD
on:
  push: {branches: [main]}
  pull_request: {branches: [main]}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- 1. Sécurité et qualité du code source ----------
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt flake8 bandit pip-audit pytest
      - run: flake8 app tests --max-line-length 130          # syntaxe / style
      - run: bandit -r app -ll                               # SAST
      - run: pip-audit -r requirements.txt                   # dépendances vulnérables (SCA)
      - run: pytest -q                                       # tests unitaires

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # requis par gitleaks pour lister les commits d'une PR
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}

  # ---------- 2. Image Docker : build, validation, sécurité ----------
  docker:
    needs: [code-quality, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint du Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with: {dockerfile: Dockerfile, failure-threshold: error}

      - name: Scan des misconfigurations (Dockerfile, compose) - Trivy config
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build de l'image
        run: docker build -t secure-login:ci .

      - name: Validation - démarrage, santé, utilisateur non-root
        run: bash scripts/ci-validate-container.sh

      - name: Validation - test fonctionnel (inscription, connexion, CSRF, en-têtes)
        run: pip install requests && python tests/smoke_container.py http://localhost:8080

      - name: Scan des CVE de l'image (Trivy) - bloque si HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: secure-login:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: SBOM (inventaire des composants)
        uses: anchore/sbom-action@v0
        with:
          image: secure-login:ci
          artifact-name: sbom.spdx.json

      - name: DAST - OWASP ZAP baseline sur le conteneur en marche
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8080
          fail_action: false            # passer à true une fois les alertes traitées
          allow_issue_writing: false

      - name: Logs du conteneur en cas d'échec
        if: failure()
        run: docker logs app

  # ---------- 3. Publication de l'image (uniquement sur main) ----------
  publish:
    if: github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write        # signature keyless cosign
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/setup-buildx-action@v3
      - id: push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Signature de l'image
        run: cosign sign --yes ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}

  # ---------- 4. Déploiement (à adapter à l'hébergeur choisi) ----------
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production          # approbation manuelle + secrets de l'environnement
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Vérification de la signature avant déploiement
        run: |
          cosign verify ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }} \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Déploiement
        run: |
          echo "A completer selon l'hebergeur (Render, Fly.io, AWS App Runner)"
          echo "Image a deployer : ${{ env.IMAGE }}@${{ needs.publish.outputs.digest }}"
      - name: Vérification post-déploiement
        if: vars.APP_URL != ''
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors ${{ vars.APP_URL }}/health
      - name: DAST sur l'environnement déployé
        if: vars.APP_URL != ''
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.APP_URL }}
          fail_action: false
